subprojects {
    apply plugin: 'java'

    group = 'com.gigachat.unit.tests.generator'
    version = '0.1.0'

    repositories {
        mavenCentral()
        maven {
            url = uri('https://repo.gradle.org/gradle/libs-releases')
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
