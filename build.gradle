subprojects {
    apply plugin: 'java'

    group = 'com.gigachat.unit.tests.generator'
    version = '0.1.0'

    repositories {
        mavenCentral()
        maven { url 'https://repo.gradle.org/gradle/libs-releases' }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

if (project.findProject(':entrypoint') != null) {
    tasks.register('diffGenUnitTest') {
        group = 'verification'
        description = 'Runs diff-based unit test generation from the entrypoint module.'
        dependsOn(':entrypoint:diffGenUnitTest')
    }
}
