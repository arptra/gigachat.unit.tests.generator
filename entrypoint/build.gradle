import org.gradle.api.Project
import org.gradle.api.plugins.JavaPluginExtension

def legacyJavaConvention(Project project) {
    new LegacyJavaPluginConvention(project)
}

plugins {
    id 'application'
}

ext.convention = new LegacyConventionAdapter(project)
ext.JavaPluginConvention = legacyJavaConvention(project)

dependencies {
    implementation libs.javaparser

    testImplementation libs.junit
    testRuntimeOnly libs.junit.platform.launcher
}

application {
    mainClass = 'com.gigachat.unit.tests.generator.MainAgentEntry'
}

tasks.named('run').configure {
    workingDir = project.rootProject.projectDir
}

java {
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register('MainAgentEntry.main', JavaExec) {
    group = 'application'
    description = 'Runs com.gigachat.unit.tests.generator.MainAgentEntry directly.'
    mainClass = 'com.gigachat.unit.tests.generator.MainAgentEntry'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootProject.projectDir
}

class LegacyConventionAdapter {
    private Project project

    LegacyConventionAdapter(Project project) {
        this.project = project
    }

    def getPlugin(Class<?> type) {
        project.extensions.getByType(type)
    }

    def findPlugin(Class<?> type) {
        project.extensions.findByType(type)
    }

    def getPlugins() {
        this
    }

    def propertyMissing(String name) {
        project.extensions.findByName(name)
    }
}

class LegacyJavaPluginConvention {
    private JavaPluginExtension javaExtension

    LegacyJavaPluginConvention(Project project) {
        this.javaExtension = project.extensions.getByType(JavaPluginExtension)
    }

    def getSourceSets() {
        javaExtension.sourceSets
    }

    def propertyMissing(String name) {
        if (javaExtension.metaClass.hasProperty(javaExtension, name)) {
            javaExtension."$name"
        } else {
            def getter = javaExtension.metaClass.getMetaMethod("get${name.capitalize()}")
            getter ? getter.invoke(javaExtension) : null
        }
    }
}
